PLG_QUICKICON_EOS="Ìomhaigh Luath - Brath mu Dheireadh Taic Joomla 6"
PLG_QUICKICON_EOS_MESSAGE_ERROR_SUPPORT_ENDED="<p>Tha taic airson an dreach agad de Joomla 6 air tighinn gu crìch. <a href=\"%2$s\" target=\"_blank\" rel=\"noopener noreferrer\">Ùraich gu Joomla 7</a> cho luath ’s a ghabhas.</p>"
PLG_QUICKICON_EOS_MESSAGE_INFO_01="<p>Tha Joomla 7 air ruighinn! Faigh a-mach a h-uile nì a bheir Joomla 7 dhut. Thoir sùil air an duilleag tòiseachaidh airson <a href=\"%2$s\" target=\"_blank\" rel=\"noopener noreferrer\">feartan Joomla 7</a> agus leasachaidhean.</p>"
PLG_QUICKICON_EOS_MESSAGE_INFO_02="<p>Cuin a bu chòir dhut ùrachadh gu Joomla 7? Aon uair ’s gu bheil leudachain na làraich agad co-fhreagarrach. Ionnsaich <a href=\"%2$s\" target=\"_blank\" rel=\"noopener noreferrer\">mar a chleachdas tu an Ro‑sgrùdar Ro‑ùrachaidh</a>.</p>"
PLG_QUICKICON_EOS_MESSAGE_WARNING_SECURITY_ONLY="<p>Tha Joomla 6 a-nis ann am modh tèarainteachd a-mhàin. Thig taic gu crìch air %1$s. Tòisich air <a href=\"%2$s\" target=\"_blank\" rel=\"noopener noreferrer\">dealbhadh airson ùrachadh</a> gu Joomla 7 an-diugh.</p>"
PLG_QUICKICON_EOS_MESSAGE_WARNING_SUPPORT_ENDING="<p>Thig taic gu crìch air %1$s airson Joomla 6. <a href=\"%2$s\" target=\"_blank\" rel=\"noopener noreferrer\">Ùraich gu Joomla 7</a> cho luath ’s a ghabhas.</p>"
PLG_QUICKICON_EOS_SNOOZE_BUTTON="Cuir às do an teachdaireachd seo airson a h-uile neach-cleachdaidh"
PLG_QUICKICON_EOS_XML_DESCRIPTION="Bidh e a’ sgrùdadh inbhe deireadh-taic Joomla 6 agus a’ toirt brath nuair a thèid tadhal air duilleag a’ Phannal-smachd."
