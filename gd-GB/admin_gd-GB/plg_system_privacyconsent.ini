PLG_SYSTEM_PRIVACYCONSENT_XML_DESCRIPTION="Plugan bunaiteach gus cead an neach-cleachdaidh a shireadh ri poileasaidh prìobhaideachd na làraich. Thèid luchd-cleachdaidh a th' ann mar-thà nach eil air cead a thoirt fhathast ath-stiùireadh nuair a logas iad a-steach gus an cunntas aca ùrachadh."
